# Publishes the site to GitHub Pages on every push to the working branch.
#
# One thing has to be done by hand, once:
#   the repository on GitHub -> Settings -> Pages -> Build and deployment
#   -> Source: "GitHub Actions"
#
# Free GitHub Pages needs a public repository. On a private one the workflow
# runs and then fails at the deploy step.
#
# The resulting address is https://<user>.github.io/<repository>/
name: Publish the site

on:
  push:
    branches: [main, claude/happiness-suicide-index-map-bkbh8x]
  # Allows publishing by hand from the Actions tab, without a push.
  workflow_dispatch:

# The least it needs to be able to write to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time: if a new one starts while the last is still
# running, the old one is left to finish rather than cut off half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        # The base has to match the repository name, or the site looks for its
        # own files at the root of the domain and comes up blank.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
